# THE ONE QA PIPELINE THIS REPOSITORY HAS, and it runs for a release request and nothing else.
#
# There is no push pipeline any more, and `ci-post-receive.yml` is what this file replaces.
# qits-projects keeps a backing branch `release/<id>` per open release request — an octopus merge of
# that request's sources, refolded whenever the set changes — and publishes `ReleaseRequestChanged`
# on every successful re-fold. The merge primitive that writes that branch fires no `post-receive`
# and so publishes no `SCMPublishCommit`: without this file the fold exists and NOTHING BUILDS IT.
# A fold the git host answered `unchanged`, and one that conflicted, publish nothing — so every
# arrival here is a new sha worth a build.
#
# DECIDED AT MAIN, BUILT AT THE FOLD. This file is discovered, parsed and selected at `main`'s head,
# always; only the run's branch and sha come from the payload, which is why `checkout:` names them
# as a pair — a sha with no branch whose history holds it is not something a step container can
# fetch. A release request therefore cannot alter the CI that gates it by folding in a commit that
# edits this file. Inside a step, $QITS_CI_BRANCH is `release/<id>` and $QITS_CI_SHA is the merged
# sha; the fold is already checked out, so nothing below fetches or switches refs.
#
# EVERY STEP HERE IS GATING, and there is no trailing `gating: false` half because this repository
# publishes nothing from a fold. The verdict returns on the ordinary `BuildSuccessful`/`BuildFailed`
# with `commitSha` = the merged sha, which is what qits-projects' `BuildStatusListener` matches on
# together with `repoId`.
#
# ci-event-release.yml BESIDE THIS FILE IS UNTOUCHED and is still the other half: it reacts to this
# repository's release TAG and publishes the released coordinate. This file names a build by the
# merged sha; that one names a release by its version. Neither pushes the other's coordinate.
#
# ONE STEP, AND THE PRERELEASE LEG IS GONE WITH THE PUSH PIPELINE THAT JUSTIFIED IT. The retired
# file had a second, `branches: [exact: main]` step that cut `<last released version>-main.g<sha7>`
# under the `main` dist-tag on every push to main — the split existed because one step had once
# published a prerelease whose identifier said `main` from a commit that was never on it
# (`2026.801.63140-main.gab854a1`). There are no pushes to main to hang that leg off any more, and a
# fold is `release/<id>`, so it is dropped rather than repointed. `@qits/ui-components` is published
# by ci-event-release.yml, from the release TAG, and that is now the only thing that publishes it.
# The consequence, stated plainly: the `main` dist-tag stops advancing, and a consumer that was
# pinning `@qits/ui-components@main` has to move to a released version.
#
# This step declares no `docker: true`: nothing it does needs a docker socket or a host daemon, so
# it keeps the ordinary sandbox that an image-publishing step has to give up.
#
# The two registry URLs arrive as environment — QITS_NPM_PROXY_URL (the pull-through cache of
# npmjs) and QITS_NPM_REGISTRY_URL (the hosted repository releases publish into) — so no deployment
# fact is written down here. The `${QITS_NPM_REGISTRY_URL#http:}` strip turns the URL into the
# `//host/path/` form npm keys credentials by; the token it keys is ceremony for the npm CLI's own
# pre-flight, which refuses to publish when no credential is configured. This step publishes
# nothing, so it buys nothing here — the preamble is kept byte-identical to ci-event-release.yml's,
# which does publish and does need it.
#
# The test step runs the jsdom target (`pnpm test`), never vitest browser mode: this image has no
# chromium and CI is not the place to download one. A component that genuinely needs a layout
# engine gets a `.browser.spec.ts` and a `test-browser` target, run locally until a build image
# ships a browser.
#
# `pnpm build-storybook` ships nothing FROM HERE — storybook-static/ is gitignored and dies with the
# container. It runs so the workbench cannot rot unnoticed: a story that stops compiling, a broken
# .storybook config or a compodoc pass that fails to produce the property tables all fail here
# instead of the next time someone runs `pnpm storybook`. Like the build it is Vite compiling, not
# a browser rendering, so the browserless image above is enough.
#
# The RELEASE pipeline does ship it: ci-event-release.yml builds the same workbench and PUTs it to
# qits-platform-artifacts as a `docs` artifact, served at /platform-docs/@qits/ui-components/. So this step is
# the rot check it always was, and the released bundle is built from the tag rather than reused from
# here — no state crosses runs. Docs are published on release only, which is now the only thing that
# publishes at all from this repository.

event: ReleaseRequestChanged

when:
  # repoName, not repoId: the git host's storage coordinate is an opaque UUID since
  # the identity cutover, so a name match on repoId is not dependable. The event
  # echoes the public name; a rename updates this line in the same campaign.
  - repoName: { exact: qits-ui-components-jslib }

checkout:
  branch: backingBranch
  sha: mergedSha

steps:
  - image: qits/build-images/node-base:latest
    timeout-seconds: 1800
    script: |
      # -u is load-bearing: with the registry vars unset, an unset-tolerant script writes a
      # registry-less .npmrc and the install below resolves the @qits scope against npmjs.org,
      # where these packages do not exist and never will.
      set -eu

      cat > ~/.npmrc <<EOF
      registry=${QITS_NPM_PROXY_URL}
      @qits:registry=${QITS_NPM_REGISTRY_URL}
      # npm-CLI ceremony only — qits-platform-artifacts requires and reads no credential.
      ${QITS_NPM_REGISTRY_URL#http:}:_authToken=qits-ci
      EOF

      pnpm install --frozen-lockfile
      pnpm lint
      pnpm test
      pnpm build
      pnpm build-storybook

